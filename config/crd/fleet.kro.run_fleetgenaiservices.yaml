---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: fleetgenaiservices.fleet.kro.run
spec:
  group: fleet.kro.run
  names:
    kind: FleetGenAIService
    listKind: FleetGenAIServiceList
    plural: fleetgenaiservices
    shortNames:
    - fgs
    singular: fleetgenaiservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.summary.placed
      name: Placed
      type: integer
    - jsonPath: .status.summary.ready
      name: Ready
      type: integer
    - jsonPath: .status.summary.readyReplicas
      name: Replicas
      type: string
    - jsonPath: .status.summary.requestedReplicas
      name: Requested
      type: string
    - jsonPath: .status.conditions[?(@.type=="Placed")].reason
      name: PlacedCond
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FleetGenAIService is one GenAIService authored once on the hub and placed
          onto the members its placement resolves to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FleetGenAIServiceSpec defines the desired state: which GenAIService to
              place, and where.
            properties:
              placement:
                description: |-
                  Placement says where the template goes. Platform-owned: the
                  developer's template never names a cluster, a cloud or a region.
                properties:
                  clusterSelector:
                    description: |-
                      ClusterSelector selects ClusterProfile objects by label. An empty
                      selector matches no clusters (explicit opt-in, no accidental
                      fleet-wide blast). Mutually exclusive with decisionRef/placementKey.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  decisionRef:
                    description: |-
                      DecisionRef names a PlacementDecision in this namespace to consume.
                      The decision is read-only input; its producer owns it.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  placementKey:
                    description: |-
                      PlacementKey discovers PlacementDecision slices in this namespace by
                      the multicluster.x-k8s.io/placement-key label (KEP-5313's recommended
                      discovery); slices are merged in multicluster.x-k8s.io/decision-index
                      order. Mutually exclusive with decisionRef.
                    type: string
                  requirements:
                    description: |-
                      Requirements are hard constraints every decided cluster must satisfy.
                      They are INPUT to the producer and a GUARD here: kro-fleet never
                      selects clusters with them, but it refuses — as a whole, placing
                      nothing — a decision that names a cluster violating them
                      (Placed=False/DecisionViolatesRequirements). There is no graceful
                      fallback for a hard constraint.
                    properties:
                      matchProperties:
                        additionalProperties:
                          type: string
                        description: |-
                          MatchProperties requires each named property (About API /
                          ClusterProfile.status.properties name) to be present on the member's
                          ClusterProfile with exactly this value.
                        type: object
                    type: object
                  tolerance:
                    description: |-
                      Tolerance controls how partial readiness folds into the rolled-up
                      Ready condition.
                    properties:
                      minReadyClusters:
                        description: |-
                          MinReadyClusters is the number of placed clusters that must report
                          ready for Ready to be True when the template is replicated (no
                          per-member replica parameters). Unset means "all placed clusters".
                        format: int32
                        minimum: 0
                        type: integer
                      minReadyReplicas:
                        description: |-
                          MinReadyReplicas is the number of ready replicas, summed across
                          members, required for Ready to be True when the template is divided
                          (the decision carries per-member replicas). Unset means "all requested
                          replicas" (the template's replicas).
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                type: object
              template:
                description: |-
                  Template is the GenAIService to materialize on each selected member
                  cluster. The placed object gets the same namespace/name as this
                  FleetGenAIService.
                properties:
                  spec:
                    description: |-
                      Spec is the GenAIService spec, passed through verbatim to each
                      member — except for values a decision's per-member parameters
                      override (today: replicas). It is intentionally unvalidated here: its
                      schema is owned by the members' ResourceGraphDefinition (stock kro).
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                required:
                - spec
                type: object
            required:
            - placement
            - template
            type: object
          status:
            description: |-
              FleetGenAIServiceStatus is the fleet view aggregated back onto the hub
              object.
            properties:
              clusters:
                description: |-
                  Clusters holds one readiness entry per member the object is placed on
                  (plus members pending removal). It is a view, not the inventory: what
                  was applied where is tracked per (instance, member) in
                  AppliedManifestRecord objects, which drive unplacement and teardown.
                items:
                  description: ClusterStatus is the per-member slice of the fleet
                    view.
                  properties:
                    assignedReplicas:
                      description: AssignedReplicas is the replica count this member's
                        copy was given.
                      format: int32
                      type: integer
                    endpoint:
                      description: |-
                        Endpoint is the member's externally reachable endpoint for this
                        copy, when the member reports one (e.g. its cloud load balancer).
                      type: string
                    message:
                      description: |-
                        Message carries a human-oriented note (e.g. why not ready, or that
                        the member is unreachable).
                      type: string
                    name:
                      description: Name is the ClusterProfile name (unique within
                        the fleet namespace).
                      type: string
                    ready:
                      description: |-
                        Ready reports whether the placed GenAIService is ready on this
                        member (kro instance state ACTIVE or a true Ready condition).
                      type: boolean
                    readyReplicas:
                      description: ReadyReplicas is the member's reported ready replica
                        count.
                      format: int32
                      type: integer
                  required:
                  - name
                  - ready
                  type: object
                type: array
              conditions:
                description: |-
                  Conditions: Placed (did the placement resolve, and to what) and Ready
                  (per-member readiness folded through spec.placement.tolerance).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the spec generation last acted
                  upon.
                format: int64
                type: integer
              placement:
                description: |-
                  Placement records the resolved decision — where the copies were sent
                  and why — so it can be shown after the fact.
                properties:
                  clusters:
                    description: Clusters is the resolved member set, in decision
                      order.
                    items:
                      description: PlacedCluster is one member of the resolved placement.
                      properties:
                        name:
                          description: Name is the ClusterProfile name.
                          type: string
                        parameters:
                          additionalProperties:
                            type: string
                          description: Parameters are the per-member parameters applied
                            to this member's copy.
                          type: object
                        reason:
                          description: Reason is the producer's per-cluster reason,
                            when set.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  decisionNames:
                    description: DecisionNames lists the PlacementDecision slice(s)
                      consumed.
                    items:
                      type: string
                    type: array
                  reason:
                    description: |-
                      Reason is the decision-level reason the producer gave (why the
                      decision is empty or partial), when set.
                    type: string
                  schedulerName:
                    description: SchedulerName is the decision's schedulerName, when
                      set.
                    type: string
                  source:
                    description: Source is ClusterSelector or PlacementDecision.
                    type: string
                required:
                - source
                type: object
              summary:
                description: Summary counts placements and replicas for quick fleet-level
                  reading.
                properties:
                  assignedReplicas:
                    description: AssignedReplicas is the sum of replicas the decision
                      assigned.
                    format: int32
                    type: integer
                  placed:
                    description: Placed is the number of members the object is currently
                      applied to.
                    format: int32
                    type: integer
                  ready:
                    description: Ready is the number of those members reporting ready.
                    format: int32
                    type: integer
                  readyReplicas:
                    description: ReadyReplicas is the sum of ready replicas reported
                      by members.
                    format: int32
                    type: integer
                  requestedReplicas:
                    description: RequestedReplicas is the total the template asks
                      for.
                    format: int32
                    type: integer
                required:
                - placed
                - ready
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
